<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#f4f1ea" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MUT" />
<title>MUT</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --panel2:#efece3; --line:#ded9cd;
  --text:#2f342e; --dim:#7d7a70; --accent:#6f8a67; --warn:#a5674f;
  --salima:#728d6a; --orange:#e6552e; --senf:#c9a44a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.app{min-height:100%;display:flex;flex-direction:column;}
.inhalt{flex:1;padding:28px 18px 100px;max-width:620px;margin:0 auto;width:100%;}
.screen{display:flex;flex-direction:column;gap:14px;}
.zentriert{justify-content:center;min-height:78vh;text-align:center;}
h1{font-size:22px;font-weight:600;margin:4px 0;}
h2{font-size:18px;font-weight:500;margin:0;color:var(--dim);}
.tempo{font-size:20px;color:var(--dim);margin:0 0 20px;}
.hint{color:var(--dim);font-size:14px;margin:-6px 0 2px;}
.ruhe{font-size:19px;margin:30px 0;}
.leseregel{color:var(--dim);font-size:14px;border-left:2px solid var(--line);padding-left:12px;}
.feld{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-top:10px;}
.choice{display:flex;flex-wrap:wrap;gap:8px;}
.chip,.wort{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;cursor:pointer;}
.chip.aktiv{background:var(--accent);border-color:var(--accent);color:#fff;}
.wort{align-self:flex-start;color:var(--dim);}
.wort.aktiv{background:var(--panel2);color:var(--text);border-color:var(--accent);}
.wort.leise{align-self:center;background:none;border:none;color:var(--dim);font-size:13px;margin-top:16px;padding:8px;opacity:.75;}
.skala{display:flex;flex-wrap:wrap;gap:6px;}
.skala-b{flex:1 1 8%;min-width:40px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 0;font-size:16px;cursor:pointer;}
.skala-b.aktiv{background:var(--accent);border-color:var(--accent);color:#fff;}
.ampel{display:flex;flex-direction:column;gap:8px;}
.ampel-b{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;text-align:left;cursor:pointer;}
.ampel-b.aktiv{border-color:var(--accent);background:var(--panel2);}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px;}
.nav-b{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px 14px;font-size:16px;cursor:pointer;}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:16px;cursor:pointer;margin-top:6px;width:100%;}
.btn.gross{background:var(--accent);border-color:var(--accent);color:#fff;margin-top:18px;padding:16px;}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff;}
.btn[disabled]{opacity:.4;}
.text,.pw{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;width:100%;}
.fehler{color:#a24b4b;font-size:14px;}
.karte{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
.karte ol{padding-left:20px;} .karte li{margin:6px 0;}
.kontakte{display:flex;flex-direction:column;gap:10px;}
.kontakt-b{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:18px;text-align:center;text-decoration:none;}
hr{border:none;border-top:1px solid var(--line);margin:16px 0;}
.krisen-leiste{position:fixed;left:0;right:0;bottom:0;background:var(--warn);color:#fff;border:none;border-top:1px solid rgba(0,0,0,.12);padding:16px;font-size:16px;cursor:pointer;z-index:50;}
.logo{width:min(80%,340px);height:auto;display:block;margin:0 auto 2px;}
.logo-klein{width:132px;height:auto;display:block;margin:26px auto 0;opacity:.7;}
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0;}
.bubble{padding:12px 14px;border-radius:14px;max-width:88%;font-size:16px;line-height:1.45;}
.bubble.assistant{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.bubble.user{background:var(--panel2);border:1px solid var(--line);align-self:flex-end;border-bottom-right-radius:4px;}
.passt{display:flex;gap:8px;align-self:flex-start;margin:-2px 0 4px;}
textarea.text{resize:vertical;font-family:inherit;}
</style>
</head>

/* ============ Verschlüsselung: AES-GCM, Schlüssel aus Passphrase (PBKDF2). ============
   Der Schlüssel lebt nur im Speicher der Sitzung, wird nie gespeichert. */
const _enc = new TextEncoder(), _dec = new TextDecoder();
function randomBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', _enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptObj(key, obj){
  const iv = randomBytes(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, _enc.encode(JSON.stringify(obj)));
  return { iv: Array.from(iv), ct: Array.from(new Uint8Array(ct)) };
}
async function decryptObj(key, p){
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:new Uint8Array(p.iv)}, key, new Uint8Array(p.ct));
  return JSON.parse(_dec.decode(plain));
}

/* ============ Lokaler Speicher: IndexedDB, mit localStorage-Rückfall. Alles verschlüsselt. ============
   Am iPhone können bei lokal geöffneten Dateien beide Speicher gesperrt sein — dann meldet die App das. */
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('mut',1);
    r.onupgradeneeded = ()=>{
      const db = r.result;
      if(!db.objectStoreNames.contains('entries')) db.createObjectStore('entries',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'k'});
    };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
function idbRaw(store, mode, fn){
  return openDB().then(db=>new Promise((res,rej)=>{
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  }));
}

let STORAGE = null; // 'idb' | 'ls'
async function pickStorage(){
  if(STORAGE) return STORAGE;
  try{ await idbRaw('meta','readonly',st=>st.get('__probe__')); STORAGE='idb'; }
  catch(e){ STORAGE='ls'; }
  return STORAGE;
}
const LS = {
  get(s,k){ if(s!=='meta') return undefined; const v=localStorage.getItem('mut_meta_'+k); return v?JSON.parse(v):undefined; },
  put(s,v){ if(s==='meta'){ localStorage.setItem('mut_meta_'+v.k, JSON.stringify(v)); }
            else { const a=JSON.parse(localStorage.getItem('mut_entries')||'[]'); a.push(v); localStorage.setItem('mut_entries', JSON.stringify(a)); } },
  all(s){ return s==='entries' ? JSON.parse(localStorage.getItem('mut_entries')||'[]') : []; },
  clear(s){ if(s==='entries'){ localStorage.removeItem('mut_entries'); } else { for(const k of ['salt','check']) localStorage.removeItem('mut_meta_'+k); } }
};
async function idbGet(s,k){ try{ if((await pickStorage())==='idb') return await idbRaw(s,'readonly',st=>st.get(k)); }catch(e){ STORAGE='ls'; } return LS.get(s,k); }
async function idbPut(s,v){ try{ if((await pickStorage())==='idb') return await idbRaw(s,'readwrite',st=>st.put(v)); }catch(e){ STORAGE='ls'; } return LS.put(s,v); }
async function idbAll(s){ try{ if((await pickStorage())==='idb') return await idbRaw(s,'readonly',st=>st.getAll()); }catch(e){ STORAGE='ls'; } return LS.all(s); }
async function idbClear(s){ try{ if((await pickStorage())==='idb') return await idbRaw(s,'readwrite',st=>st.clear()); }catch(e){ STORAGE='ls'; } return LS.clear(s); }

let KEY = null;
async function hasVault(){ return !!(await idbGet('meta','salt')); }
async function unlock(pass){
  const salt = await idbGet('meta','salt');
  const check = await idbGet('meta','check');
  if(!salt){
    const s = Array.from(randomBytes(16));
    const k = await deriveKey(pass, new Uint8Array(s));
    const token = await encryptObj(k, {ok:true});
    await idbPut('meta', {k:'salt', v:s});
    await idbPut('meta', {k:'check', v:token});
    KEY = k; return true;
  }
  const k = await deriveKey(pass, new Uint8Array(salt.v));
  try{ const t = await decryptObj(k, check.v); if(t && t.ok){ KEY=k; return true; } return false; }
  catch(e){ return false; }
}
async function addEntry(e){
  const id = crypto.randomUUID(), ts = Date.now();
  const blob = await encryptObj(KEY, Object.assign({id,ts}, e));
  await idbPut('entries', {id, ts, modus:e.modus||'spontan', blob});
}
async function getAll(){
  const rows = await idbAll('entries'); const out = [];
  for(const r of rows){ try{ out.push(await decryptObj(KEY, r.blob)); }catch(_){} }
  out.sort((a,b)=>a.ts-b.ts); return out;
}
async function exportJSON(){ return JSON.stringify(await getAll(), null, 2); }
async function wipe(){ await idbClear('entries'); await idbClear('meta'); KEY=null; APIKEY=null; }

  try{ const m = await idbGet('meta','model'); if(m && m.v) MODEL = m.v; }catch(_){}
}
async function saveApiKey(k){ const tok = await encryptObj(KEY, {k}); await idbPut('meta', {k:'apikey', v:tok}); APIKEY = k; }
async function clearApiKey(){ await idbPut('meta', {k:'apikey', v:null}); APIKEY = null; }

    <p class="hint">Dein eigener Anthropic-Schlüssel. Er wird verschlüsselt nur auf diesem Gerät gespeichert und geht direkt von hier zu Anthropic — kein Server dazwischen. Ohne Schlüssel führt MUT dich in ruhigen Fragen; mit Schlüssel wird daraus ein echtes Gespräch.</p>
    ${APIKEY
      ? `<p class="hint">Schlüssel ist hinterlegt. Aktives Modell: ${esc(MODEL)}.</p>
         <button class="btn" data-act="clearkey">Schlüssel entfernen</button>`
      : `<input id="apik" class="text" type="password" placeholder="sk-ant-…" autocomplete="off" />
         <button class="btn" data-act="savekey">Schlüssel speichern</button>`}
    <label class="feld">Modell</label>
    <div class="choice">
      ${[['claude-sonnet-5','Sonnet 5'],['claude-opus-5','Opus 5'],['claude-haiku-4-5','Haiku 4.5']]
        .map(([id,l])=>`<button class="chip${MODEL===id?' aktiv':''}" data-act="setmodel" data-v="${id}">${l}</button>`).join('')}
    </div>
    <hr/>
    ${state.f._del
      ? `<div class="karte"><p>Wirklich alles unwiderruflich löschen? Kein Recovery.</p>
         <button class="btn warn" data-act="wipe-do">Ja, löschen</button>
         <button class="btn" data-act="wipe-cancel">Abbrechen</button></div>`
      : `<button class="btn warn" data-act="wipe-ask">Alles löschen</button>`}
    <hr/>
    <button class="btn" data-act="back">Zurück</button>
  </div>`);
}

function render(){ ensureChatSeed(); root.innerHTML = view(); const pw=document.getElementById('pw'); if(pw) pw.focus();
  if(state.screen==='gespraech'){ requestAnimationFrame(()=>window.scrollTo(0, document.body.scrollHeight)); } }

/* ============ Interaktion (Delegation) ============ */
root.addEventListener('click', async (ev)=>{
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, v = b.dataset.v, field = b.dataset.field;
  switch(act){
    case 'go': state.screen = b.dataset.screen; state.f = {}; render(); break;
    case 'back': state.screen = 'einstieg'; state.f = {}; render(); break;
    case 'fenster': state.fenster = v; render(); break;
    case 'set': state.f[field] = v; render(); break;
    case 'skala': state.f[field] = Number(v); render(); break;
    case 'keinwort': state.f._keinwort = !state.f._keinwort; if(state.f._keinwort) state.f.qualitaet=null; render(); break;
    case 'klasse': {
      const kl = new Set(state.f.klassen||[]); kl.has(v)?kl.delete(v):kl.add(v); state.f.klassen=[...kl]; render(); break;
    }
    case 'unlock': {
      const pass = document.getElementById('pw').value;
      if(!pass) return;
      const ok = await unlock(pass);
      if(ok){ await loadSecrets(); state.entsperrt=true; state.f={}; state.screen='einstieg'; render(); }
      else { state.f._fehler=true; render(); }
      break;
    }
    case 'unlock-reset-ask': state.f._reset=true; render(); break;
    case 'unlock-reset-cancel': state.f._reset=false; render(); break;
    case 'unlock-reset': { await wipe(); state.f={_neu:true}; render(); break; }
    case 'save-nacht': {
      await addEntry({
        modus:'nacht', fenster:state.fenster||null,
        substanz:state.f.substanz||'keine',
        schmerz_nacht:state.f.schmerz??null,
        ort:state.f.ort||null,
        qualitaet:state.f._keinwort?null:(state.f.qualitaet||null),
        kein_wort:!!state.f._keinwort,
        einschlafen:state.f.einschlafen||null,
        durchschlafen:state.f.durchschlafen||null,
        erholsam:state.f.erholsam||null,
        unterscheidung:state.f.unterscheidung||null
      });
      state.f={_fertig:true}; render(); break;
    }
    case 'save-checkin': {
      if(state.f.schmerz==null) return;
      const lok=document.getElementById('lok'); const lokV=lok?lok.value:'';
      await addEntry({
        modus:'checkin', fenster:state.fenster||null,
        koerper:{intensitaet:state.f.schmerz, lokalisation:lokV||null},
        affekt:state.f.affekt?{position:state.f.affekt}:null,
        absorption:state.f.absorption?{vorhanden:state.f.absorption==='ja'}:null,
        ereignisklassen:state.f.klassen||[]
      });
      state.f={_fertig:true}; render(); break;
    }
    case 'export': {
      const json = await exportJSON();
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download='mut-export-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
      URL.revokeObjectURL(url); break;
    }
    case 'lock': KEY=null; state.entsperrt=false; state.f={}; render(); break;
    case 'wipe-ask': state.f._del=true; render(); break;
    case 'wipe-cancel': state.f._del=false; render(); break;
    case 'wipe-do': await wipe(); state.entsperrt=false; state.f={}; state.screen='einstieg'; render(); break;

    case 'send': {
      const ta=document.getElementById('ein'); const txt=ta?ta.value.trim():'';
      if(!txt || state.chat.busy) return;
      state.chat.msgs.push({role:'user', text:txt});
      state.chat._draft=''; state.chat.saved=false;
      if(APIKEY){
        state.chat.busy=true; state.chat.err=null; render();
        try{ const r=await askKI(state.chat.msgs.map(m=>({role:m.role, content:m.text})));
             state.chat.msgs.push({role:'assistant', text:r||'…'}); }
        catch(e){ state.chat.err=e.message; }
        state.chat.busy=false; render();
      } else {
        state.chat.step=(state.chat.step||0)+1;
        const next=SKRIPT[state.chat.step];
        const refl='Ich höre: „'+txt+'".';
        state.chat.msgs.push({role:'assistant', text: next ? refl+'\n\n'+next
          : refl+'\n\nDas reicht für heute. Wenn du willst, sichere es als Spur für Maier.'});
        render();
      }
      break;
    }
    case 'passt': { const m=state.chat.msgs[state.chat.msgs.length-1]; if(m) m._done=true; render(); break; }
    case 'passtnicht': {
      const m=state.chat.msgs[state.chat.msgs.length-1]; if(m) m._done=true;
      if(APIKEY){
        state.chat.msgs.push({role:'user', text:'Das passt nicht zu dem, wie es war.'});
        state.chat.busy=true; state.chat.err=null; render();
        try{ const r=await askKI(state.chat.msgs.map(x=>({role:x.role, content:x.text})));
             state.chat.msgs.push({role:'assistant', text:r||'…'}); }
        catch(e){ state.chat.err=e.message; }
        state.chat.busy=false; render();
      } else {
        state.chat.msgs.push({role:'assistant', text:'Gut. Sag es, wie es war — in deinen Worten.'});
        render();
      }
      break;
    }
    case 'save-gespraech': {
      if(!state.chat.msgs.length) return;
      await addEntry({ modus:'gespraech', fenster:state.fenster||null,
        verlauf: state.chat.msgs.map(m=>({role:m.role, text:m.text})) });
      state.chat.saved=true; render(); break;
    }
    case 'neu-gespraech': neuesGespraech(); render(); break;
    case 'savekey': { const el=document.getElementById('apik'); const k=el?el.value.trim():''; if(k){ await saveApiKey(k); state.f={}; render(); } break; }
    case 'clearkey': await clearApiKey(); render(); break;
    case 'setmodel': await saveModel(v); render(); break;
  }
});
root.addEventListener('input', (ev)=>{ if(ev.target.id==='ein'){ state.chat._draft = ev.target.value; } });
// Enter im Passphrase-Feld
root.addEventListener('keydown', (ev)=>{
  if(ev.key==='Enter' && ev.target.id==='pw'){ const b=root.querySelector('[data-act="unlock"]'); if(b) b.click(); }
});

/* Fehler beim Start sichtbar machen statt schwarzem Bildschirm. */
function zeigeFehler(txt){
  root.innerHTML = '<div class="app"><div class="inhalt"><div class="screen">'
    + '<h1>MUT</h1><p class="hint">Start-Hinweis:</p>'
    + '<div class="karte"><p style="font-size:14px">'+String(txt).replace(/</g,'&lt;')+'</p></div>'
    + '<p class="hint">Am zuverlässigsten läuft MUT über eine Web-Adresse (https). Sag Bescheid, dann richten wir das ein.</p>'
    + '</div></div></div>';
}
window.addEventListener('error', e=>{ zeigeFehler((e && e.message) || 'unbekannter Fehler'); });

try{
  /* Start: erst prüfen, ob sichere Verschlüsselung überhaupt möglich ist. */
  if(!('crypto' in window) || !crypto.subtle){
    root.innerHTML = '<div class="app"><div class="inhalt"><div class="screen zentriert">'
      + '<h1>MUT</h1><p class="hint">Dieser Browser erlaubt hier keine sichere Verschlüsselung — '
      + 'das passiert oft, wenn eine lokale Datei am iPhone geöffnet wird. '
      + 'Öffne MUT stattdessen über eine Web-Adresse (https). Dann läuft alles verschlüsselt und offline, '
      + 'und die Daten bleiben nur auf diesem Gerät.</p></div></div></div>';
  } else {
    hasVault().then(v=>{ state.f._neu = !v; render(); }).catch(err=>{ state.f._neu=true; try{ render(); }catch(e){ zeigeFehler(e.message); } });
  }
}catch(err){ zeigeFehler(err && err.message ? err.message : err); }
</script>
